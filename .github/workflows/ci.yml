name: CI

on:
  # Check every branch, not only main
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, typecheck, test and JS bundles
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

      - name: Build the iOS and Android JS bundles
        run: pnpm --filter @scaleway-manager/mobile exec expo export --platform ios --platform android --output-dir dist

  android:
    name: Android debug build
    needs: checks
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic

      - run: pnpm install --frozen-lockfile

      - name: Generate the Android project
        run: pnpm --filter @scaleway-manager/mobile exec expo prebuild --platform android --clean

      - name: Build the debug APK
        run: cd apps/mobile/android && ./gradlew assembleDebug

  ios:
    name: iOS simulator build
    needs: checks
    timeout-minutes: 60
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Podfile.lock only exists after prebuild, so restore the newest cache by prefix
      # and save under the Podfile.lock hash afterwards.
      - name: Restore the CocoaPods cache
        id: pods-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/CocoaPods
          key: cocoapods-${{ runner.os }}
          restore-keys: cocoapods-${{ runner.os }}-

      - name: Generate the iOS project
        run: pnpm --filter @scaleway-manager/mobile exec expo prebuild --platform ios --clean

      - name: Save the CocoaPods cache
        if: steps.pods-cache.outputs.cache-matched-key != format('cocoapods-{0}-{1}', runner.os, hashFiles('apps/mobile/ios/Podfile.lock'))
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/CocoaPods
          key: cocoapods-${{ runner.os }}-${{ hashFiles('apps/mobile/ios/Podfile.lock') }}

      - name: Build for the iOS simulator
        run: xcodebuild -workspace apps/mobile/ios/ScalewayManager.xcworkspace -scheme ScalewayManager -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
